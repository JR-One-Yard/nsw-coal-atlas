<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#081720"><meta name="description" content="Explore the coal beneath the NSW coast, from Illawarra through Sydney to Newcastle. An interactive educational atlas with sourced geology and clearly labelled reconstructions."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 40 40%27%3E%3Crect width=%2740%27 height=%2740%27 rx=%278%27 fill=%27%2310222c%27/%3E%3Cpath d=%27M8 13L20 18L32 13M8 20L20 25L32 20M8 27L20 32L32 27%27 stroke=%27%23f7b967%27 stroke-width=%273%27 fill=%27none%27/%3E%3C/svg%3E"><title>NSW Coal Atlas</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./atlas-v2.css">
<script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script></head>
<body><div id="app">
<header><h1>NSW Coal Atlas</h1><nav aria-label="Main navigation"><button id="mapTab" aria-current="page">Map</button><button id="industryToggle">Mines</button><button id="sources">About</button></nav></header>
<main id="mapPage">
<div class="map-toolbar"><label class="sr-only" for="regionSelect">Region</label><select id="regionSelect"></select><button id="toggleControls" aria-expanded="false" aria-controls="controls">Layers</button><button id="openSection" aria-expanded="false" aria-controls="sectionPanel">Cross-section</button><button id="regionInfo" aria-label="Read about this region">Region notes</button></div>
<div class="map-workspace">
<section id="stage" aria-label="Interactive 3D geological landscape"><div id="viewport"></div><div id="labels"></div><div id="loading" role="status"><span class="loader"></span><p>Loading the landscape…</p></div><span class="north" aria-label="North">N ↑</span><div class="map-caption"><p>Underground layers are illustrative.</p><span>Drag to rotate · Scroll or pinch to zoom</span></div><div id="empty" hidden>No layers match this selection.</div></section>
<aside id="controls" hidden aria-label="Map layers"><div class="panel-heading"><h2>Layers</h2><button id="closeControls" aria-label="Close layers">×</button></div>
<label for="featureSelect">Find a seam or mine</label><select id="featureSelect"></select>
<div class="explore-links"><button id="openStrata">Rock sequence</button><button id="openBoreholes">Borehole logs</button></div>
<label class="range-label" for="opacity">Ground opacity <output id="opacityValue">35%</output></label><input id="opacity" type="range" min="0" max="100" value="35">
<label class="range-label" for="seamSelect">Coal layer</label><select id="seamSelect"></select><details class="layer-key"><summary>Colour key</summary><div id="legend" aria-label="Coal layer colours"></div></details>
<div class="checks"><label><input id="surfaceMap" type="checkbox" checked> Surface geology <small>Illawarra</small></label><label><input id="mappedFaults" type="checkbox"> Fault traces <small>Illawarra</small></label><label><input id="showMines" type="checkbox" checked> Mines and destinations</label><label><input id="showBoreLogs" type="checkbox" checked> Borehole depth lines <small>Recorded drilling depths</small></label><label><input id="showLabels" type="checkbox" checked> Place names</label></div>
<button id="inspectSurface" aria-pressed="false">Inspect surface rock</button>
<div id="surfaceFocus" hidden><p id="surfaceFocusText" class="micro" aria-live="polite"></p><button id="clearSurfaceFocus">Clear highlight</button></div>
<label class="range-label" for="exaggeration">Vertical scale <output id="exaggerationValue">12×</output></label><input id="exaggeration" type="range" min="1" max="30" value="12"><p class="micro">Height and depth are exaggerated equally.</p><button id="reset" class="subtle">Reset map</button></aside>
<aside id="details" hidden aria-label="Geological details"><div class="panel-heading"><h2 id="detailHeading">Details</h2><button id="closeDetails" aria-label="Close details">×</button></div><div id="detailBody"></div><section id="strataPanel" hidden></section></aside>
</div></main>
<section id="aboutPage" class="reading-page" hidden aria-labelledby="aboutTitle"><h2 id="aboutTitle" tabindex="-1">About this atlas</h2><div id="sourceBody"></div></section>
</div><script type="module" src="./app.js"></script></body></html>
